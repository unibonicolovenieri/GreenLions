<style>
  :root {
    /* colori presi dalle divise: giallo e verde della prima maglia,
       bianco e azzurro del portiere, rosso della seconda */
    --kit-giallo:  #efc41a;
    --kit-verde:   #1c7a3e;
    --kit-verde-s: #12522a;
    --kit-rosso:   #c8202b;
    --kit-bianco:  #eef3f4;
    --kit-azzurro: #58bcd6;

    --bg:        #f6f4e9;
    --surface:   #ffffff;
    --surface-2: #ece9d9;
    --ink:       #16211a;
    --ink-2:     #566159;
    --ink-3:     #8b948c;
    --line:      #ddd9c6;
    --accent:    var(--kit-verde);
    --accent-ink:#ffffff;
    --accent-sf: #e2f0e5;
    --danger:    #9d1a24;
    --danger-sf: #fbeae9;
    --radius:    14px;
    --shadow:    0 1px 2px rgba(18,40,26,.07), 0 10px 26px -14px rgba(18,40,26,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0d1610;
      --surface:   #15201a;
      --surface-2: #1e2b23;
      --ink:       #eaf0ea;
      --ink-2:     #9fada3;
      --ink-3:     #67756c;
      --line:      #27352c;
      --accent:    #3fb56e;
      --accent-ink:#06170d;
      --accent-sf: #16311f;
      --danger:    #f0999b;
      --danger-sf: #33191b;
      --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 0 env(safe-area-inset-bottom);
  }

  /* fascia superiore a righe, come la maglia gialloverde */
  .banda {
    height: 8px;
    background: repeating-linear-gradient(
      90deg,
      var(--kit-verde) 0 22px,
      var(--kit-giallo) 22px 44px
    );
  }

  .wrap { max-width: 740px; margin: 0 auto; padding: 26px 16px 64px; }

  header { text-align: center; padding: 4px 0 20px; }
  .crest {
    display: inline-flex; align-items: center; gap: 7px;
    font: 800 11.5px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--kit-verde-s);
    background: var(--kit-giallo);
    padding: 8px 14px; border-radius: 999px;
    box-shadow: inset 0 0 0 2px var(--kit-verde);
  }
  @media (prefers-color-scheme: dark) { .crest { color: #123; } }
  .leo { width: 17px; height: 17px; flex: none; margin-left: -4px; }
  /* nel bollino giallo il muso del leone diventa crema, altrimenti si confonde col fondo */
  .crest .leo { --leo-faccia: #f8f6ec; }
  h1 { margin: 16px 0 6px; font-size: clamp(27px, 6.4vw, 36px); line-height: 1.12; letter-spacing: -.025em; }
  .lede { margin: 0 auto; max-width: 46ch; color: var(--ink-2); font-size: 15px; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin: 24px 0 14px; padding: 12px 15px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 5px solid var(--kit-giallo);
    border-radius: var(--radius);
  }
  .count { font-weight: 650; font-size: 15px; }
  .count b { font-size: 21px; color: var(--accent); }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 1px; }
  .legend .free  { background: var(--kit-verde); }
  .legend .taken { background: var(--ink-3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 10px; }

  .kit {
    position: relative;
    appearance: none; -webkit-appearance: none;
    font: inherit; text-align: center; color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 8px 10px;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s, box-shadow .12s;
    min-height: 128px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    overflow: hidden;
    --maglia: var(--kit-giallo);
    --trim:   var(--kit-verde);
  }
  .kit::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 4px;
    background: var(--trim);
  }
  .kit:hover:not(:disabled) { border-color: var(--kit-verde); transform: translateY(-2px); box-shadow: var(--shadow); }
  .kit:active:not(:disabled) { transform: translateY(0); }
  .kit:focus-visible { outline: 2px solid var(--kit-verde); outline-offset: 2px; }

  .jersey { width: 30px; height: 27px; display: block; margin-bottom: 2px; }

  .kit .num { font-size: 33px; font-weight: 800; line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .kit .sub { font-size: 11.5px; color: var(--ink-3); }
  .kit .state { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--kit-verde); margin-top: 2px; }

  .kit[data-taken] { background: var(--surface-2); cursor: not-allowed; }
  .kit[data-taken] .jersey { filter: grayscale(1); opacity: .4; }
  .kit[data-taken]::before { background: var(--ink-3); opacity: .4; }
  .kit[data-taken] .num, .kit[data-taken] .state, .kit[data-taken] .sub { color: var(--ink-3); }

  /* il portiere ha la divisa bianca e azzurra */
  .kit[data-gk] { --maglia: var(--kit-bianco); --trim: var(--kit-azzurro); }
  .kit[data-gk] .state { color: #1f8ba5; }
  .kit[data-gk]:hover:not(:disabled) { border-color: var(--kit-azzurro); }
  .kit[data-gk] .sub {
    color: #14647a; background: #d9eff5;
    border-radius: 5px; padding: 1px 6px; font-weight: 700;
    font-size: 10px; letter-spacing: .02em; white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    .kit[data-gk] .sub { color: #bfe8f2; background: #123640; }
    .kit[data-gk] .state { color: var(--kit-azzurro); }
  }
  .kit[data-taken][data-gk] .sub { color: var(--ink-3); background: transparent; }

  .note {
    margin: 18px 0 0; padding: 13px 15px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--kit-rosso);
    border-radius: 10px; font-size: 13.5px; color: var(--ink-2);
  }

  dialog {
    border: none; border-radius: 18px; padding: 0;
    background: var(--surface); color: var(--ink);
    width: min(440px, calc(100vw - 24px));
    box-shadow: var(--shadow); overflow: hidden;
  }
  dialog::backdrop { background: rgba(9,22,14,.6); backdrop-filter: blur(2px); }
  .testata { height: 6px; background: linear-gradient(90deg, var(--kit-verde), var(--kit-giallo)); }
  .sheet { padding: 20px 22px 22px; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.015em; }
  .sheet .pick { display: flex; align-items: center; gap: 11px; margin: 10px 0 18px; color: var(--ink-2); font-size: 14px; }
  .sheet .pick b { font-size: 31px; color: var(--kit-verde); font-weight: 800; font-variant-numeric: tabular-nums; }
  .sheet .pick .jersey { width: 34px; height: 31px; margin: 0; }
  @media (prefers-color-scheme: dark) { .sheet .pick b { color: var(--accent); } }

  label { display: block; margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  label span { display: block; margin-bottom: 5px; }
  input, textarea {
    width: 100%;
    font: 400 16px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--kit-verde); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 62px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 359px) { .row { grid-template-columns: 1fr; } }

  .consent { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; font-weight: 400; color: var(--ink-2); margin: 4px 0 18px; }
  .consent input { width: auto; margin: 2px 0 0; flex: none; accent-color: var(--kit-verde); }

  .actions { display: flex; gap: 9px; }
  button.btn {
    flex: 1; padding: 14px 16px; border-radius: 11px; border: 1px solid transparent; cursor: pointer;
    font: 700 15px/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .btn.primary { background: var(--kit-verde); color: #fff; }
  .btn.primary:disabled { opacity: .55; cursor: wait; }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); flex: 0 0 auto; padding-inline: 18px; }
  @media (prefers-color-scheme: dark) { .btn.primary { background: var(--accent); color: var(--accent-ink); } }

  .msg { border-radius: 10px; padding: 11px 13px; font-size: 13.5px; margin: 0 0 14px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--danger-sf); color: var(--danger); }

  .done { text-align: center; padding: 30px 24px 26px; }
  .done .jersey { width: 62px; height: 56px; margin: 0 auto 14px; }
  .done h2 { margin: 0 0 8px; font-size: 21px; }
  .done p { margin: 0 0 20px; color: var(--ink-2); font-size: 14.5px; }

  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--ink-3); }
  .skel { opacity: .4; pointer-events: none; }
</style>
</head>

const BASE = SUPABASE_URL.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
const CHIAVE = SUPABASE_KEY.trim();
const AUTH = { apikey: CHIAVE, Authorization: 'Bearer ' + CHIAVE };

const configurato = !SUPABASE_URL.startsWith('INCOLLA');
let presi = new Map();
let scelto = null;
let guasto = null;

document.getElementById('crest').textContent = SQUADRA;

function sottotitolo(k) {
  if (k.gk) return 'PORTIERE · p. 1';
  return 'pant. ' + k.p;
}

function vestiIcona(el, k) {
  el.style.setProperty('--maglia', k.gk ? 'var(--kit-bianco)'  : 'var(--kit-giallo)');
  el.style.setProperty('--trim',   k.gk ? 'var(--kit-azzurro)' : 'var(--kit-verde)');
}

function render() {
  grid.classList.remove('skel');
  grid.innerHTML = '';
  for (const k of KITS) {
    const preso = presi.has(k.n);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kit';
    if (preso) b.dataset.taken = '';
    if (k.gk)  b.dataset.gk = '';
    b.disabled = preso;
    b.innerHTML =
      '<svg class="jersey"><use href="#maglia"></use></svg>' +
      '<span class="num"></span><span class="sub"></span><span class="state"></span>';
    b.querySelector('.num').textContent = k.n;
    b.querySelector('.sub').textContent = sottotitolo(k);
    b.querySelector('.state').textContent = preso ? (presi.get(k.n) || 'preso') : 'libero';
    b.setAttribute('aria-label',
      'Numero ' + k.n + ', pantaloncini ' + k.p + (k.gk ? ', divisa da portiere' : '') +
      ', ' + (preso ? 'già preso' : 'libero'));
    if (!preso) b.addEventListener('click', () => apri(k));
    grid.appendChild(b);
  }

  const liberi = KITS.length - presi.size;
  document.getElementById('count').innerHTML =
    '<b>' + liberi + '</b> divis' + (liberi === 1 ? 'a libera' : 'e libere') + ' su ' + KITS.length;

  const note = document.getElementById('note');
  if (!configurato) {
    note.textContent = '⚠ Pagina non ancora collegata al database: apri index.html e compila SUPABASE_URL e SUPABASE_KEY.';
  } else if (guasto) {
    note.textContent = '⚠ Non riesco a leggere le prenotazioni dal database (' + guasto +
      '). I numeri qui sopra potrebbero non essere aggiornati: apri diagnostica.html per capire cosa manca.';
  } else {
    note.textContent = 'Ogni maglia ha i suoi pantaloncini. Le uniche due eccezioni sono la 10, che va con i pantaloncini 14, e la 22, che va con i 18: i numeri dei pantaloncini disponibili non coincidevano del tutto.';
  }
}

function apri(k) {
  scelto = k;
  form.hidden = false;
  done.hidden = true;
  errBox.classList.remove('show');
  document.getElementById('pickNum').textContent = k.n;
  document.getElementById('pickSub').textContent = k.gk ? 'divisa da portiere · pant. 1' : 'pantaloncini ' + k.p;
  vestiIcona(document.getElementById('pickJersey'), k);
  vestiIcona(document.getElementById('doneJersey'), k);
  dlg.showModal();
  form.querySelector('[name=nome]').focus();
}

function errore(t) {
  errBox.textContent = t;
  errBox.classList.add('show');
  errBox.scrollIntoView({ block: 'nearest' });
}

async function carica() {
  if (!configurato) { render(); return; }
  try {
    const r = await fetch(BASE + '/rest/v1/kit_presi?select=numero,nome', { headers: AUTH });
    if (r.status === 404) throw new Error('la tabella non esiste su questo progetto (404)');
    if (r.status === 401 || r.status === 403) throw new Error('chiave rifiutata (' + r.status + ')');
    if (!r.ok) throw new Error('risposta ' + r.status);
    presi = new Map((await r.json()).map(x => [x.numero, x.nome]));
    guasto = null;
  } catch (e) {
    guasto = e.message || 'nessuna risposta';
    console.error('lettura fallita:', e);
  }
  render();
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  errBox.classList.remove('show');

  const d = Object.fromEntries(new FormData(form));
  for (const k in d) d[k] = d[k].trim();

  // questi limiti devono restare identici a quelli della policy sul database,
  // altrimenti la pagina accetta un dato che poi Supabase respinge
  if (d.nome.length < 2 || d.cognome.length < 2) return errore('Scrivi nome e cognome per esteso (almeno due lettere ciascuno).');
  if (d.nome.length > 60 || d.cognome.length > 60) return errore('Nome o cognome troppo lunghi.');
  if (d.indirizzo.length > 200) return errore('L\'indirizzo è troppo lungo, accorcialo.');
  if (d.telefono.length > 25) return errore('Il numero di telefono è troppo lungo.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(d.email)) return errore('L\'email non sembra valida.');
  if (d.telefono.replace(/\D/g, '').length < 6) return errore('Il numero di cellulare non sembra valido.');
  if (d.indirizzo.length < 8) return errore('Scrivi l\'indirizzo completo di città e CAP.');
  if (!d.codice) return errore('Manca il codice squadra.');
  if (!document.getElementById('consent').checked) return errore('Serve la spunta sul consenso.');

  if (!configurato) return errore('Pagina in anteprima: il database non è ancora collegato.');

  sendBtn.disabled = true;
  sendBtn.textContent = 'Un attimo…';

  try {
    const r = await fetch(BASE + '/rest/v1/prenotazioni', {
      method: 'POST',
      headers: { ...AUTH, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ ...d, numero: scelto.n, codice: d.codice.toUpperCase() })
    });

    if (r.status === 201 || r.status === 204) {
      presi.set(scelto.n, d.nome);
      document.getElementById('doneNum').textContent = scelto.n;
      document.getElementById('doneSub').textContent = scelto.gk
        ? 'Divisa da portiere bianca, maglia 1 e pantaloncini 1. Riceverai conferma via email.'
        : 'Maglia ' + scelto.n + ' e pantaloncini ' + scelto.p + '. Riceverai conferma via email.';
      form.hidden = true;
      done.hidden = false;
      form.reset();
      render();
      return;
    }

    const body = await r.json().catch(() => ({}));
    if (r.status === 409 && String(body.message || '').includes('email_unica')) {
      errore('Con questa email hai già prenotato una divisa.');
    } else if (r.status === 409) {
      errore('Qualcuno ti ha battuto sul tempo: il numero ' + scelto.n + ' è appena stato preso. Chiudi e scegline un altro.');
      await carica();
    } else if (r.status === 401 || r.status === 403) {
      const msg = String(body.message || '');
      if (/api key/i.test(msg) || /jwt/i.test(msg)) {
        errore('La pagina non riesce ad autenticarsi con il database: la chiave è sbagliata o scaduta. Avvisa chi ha creato il link, non è colpa tua.');
      } else {
        errore('Codice squadra sbagliato. Ricontrolla la parola scritta nel gruppo — maiuscole e minuscole non contano, gli spazi sì.');
      }
    } else if (r.status === 404) {
      errore('Il database non trova la tabella delle prenotazioni: la pagina non è collegata bene. Avvisa chi ha creato il link — deve aprire diagnostica.html.');
    } else {
      errore('Non è andata a buon fine (errore ' + r.status + '). Riprova tra poco.');
    }
  } catch (e) {
    errore('Connessione assente. Controlla la rete e riprova.');
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Prenota';
  }
});

document.getElementById('cancel').onclick = () => dlg.close();
document.getElementById('close2').onclick = () => dlg.close();
dlg.addEventListener('close', () => { form.hidden = false; done.hidden = true; });

carica();
setInterval(() => { if (!dlg.open) carica(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !dlg.open) carica(); });
</script>
</body>
</html>
